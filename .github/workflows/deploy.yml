# digitAI Motor — GitHub Pages deployment
# V4: la home convierte por WhatsApp/llamada, sin formulario HTML.
# El workflow no se ejecuta al guardar codigo: publicacion manual.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # La home V4 ya no contiene un formulario: el endpoint no puede
      # aparecer en dist/index.html y NO debe exigirse para publicarla.
      # Seguimos requiriendo Analytics porque el despliegue de produccion
      # esta configurado para medir con consentimiento previo.
      - name: Verify production variables
        env:
          GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
        run: |
          test -n "$GA4_ID" || { echo "::error::Falta PUBLIC_GA4_ID. Configurala en Settings > Secrets and variables > Actions > Variables."; exit 1; }
          echo "ID de analitica configurado"

      - name: Build (produccion publica)
        run: npm run build
        env:
          PUBLIC_SITE_IS_PUBLIC: 'true'
          # Se conserva para compatibilidad con componentes y rutas futuras.
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}

      # Verificamos los mecanismos de contacto que V4 usa REALMENTE.
      # No se coloca un formulario invisible para superar una comprobacion.
      - name: Verify contacts and analytics in the generated home
        env:
          GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
        run: |
          test -f dist/index.html || { echo "::error::No se genero dist/index.html"; exit 1; }
          grep -q 'href="https://wa.me/' dist/index.html || { echo "::error::V4 no contiene un enlace funcional a WhatsApp."; exit 1; }
          grep -q 'href="tel:' dist/index.html || { echo "::error::V4 no contiene un enlace de llamada."; exit 1; }
          grep -qF "$GA4_ID" dist/index.html || { echo "::error::El ID de GA4 no llego al HTML publicado."; exit 1; }
          grep -q 'data-consent-banner' dist/index.html || { echo "::error::Falta el banner de consentimiento y hay GA4 configurado."; exit 1; }
          if grep -q '<script[^>]*googletagmanager' dist/index.html; then
            echo "::error::gtag.js se carga desde el HTML: eso saltea el consentimiento."
            exit 1
          fi
          echo "CTA WhatsApp y llamada presentes; GA4 y consentimiento verificados"

      - name: Verify CNAME survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME no existe. El dominio custom se perderia."; exit 1; }
          grep -q "www.digitaimotor.lat" dist/CNAME || { echo "::error::dist/CNAME tiene contenido inesperado."; exit 1; }
          echo "CNAME ok: $(cat dist/CNAME)"

      - name: Verify public build (sitemap + indexabilidad)
        run: |
          test -f dist/sitemap-index.xml || { echo "::error::sitemap-index.xml no generado: el build salio en estado seguro."; exit 1; }
          URLS=$(grep -o '<loc>' dist/sitemap-0.xml | wc -l)
          test "$URLS" -eq 11 || { echo "::error::El sitemap tiene $URLS URLs, se esperaban 11."; exit 1; }
          NOINDEX=$(grep -l 'content="noindex' dist/index.html dist/*/index.html 2>/dev/null | wc -l)
          test "$NOINDEX" -eq 0 || { echo "::error::$NOINDEX paginas publicas salieron con noindex."; exit 1; }
          grep -q 'content="noindex' dist/404.html || { echo "::error::/404.html perdio su noindex."; exit 1; }
          grep -q '^Allow: /' dist/robots.txt || { echo "::error::robots.txt no permite crawling."; exit 1; }
          echo "sitemap: $URLS URLs; paginas indexables; 404 noindex; robots abierto"

      - name: Verify private mailbox never leaked
        run: node scripts/check-no-private-mailbox.cjs

      - name: Verify legacy stubs
        run: |
          for f in crm-zoho automatizacion paginas-web funnel posicionamiento-geo; do
            test -f "dist/$f.html" || { echo "::error::falta dist/$f.html"; exit 1; }
            grep -q 'http-equiv="refresh" content="0; url=/' "dist/$f.html" || { echo "::error::$f.html sin meta refresh"; exit 1; }
            grep -q 'rel="canonical" href="https://www.digitaimotor.lat/' "dist/$f.html" || { echo "::error::$f.html sin canonical correcto"; exit 1; }
          done
          grep -q 'Growth Partner' dist/index.html || { echo "::error::dist/index.html no es la home."; exit 1; }
          echo "5 stubs legacy ok; la home V4 esta presente"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
