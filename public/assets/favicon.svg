  <g transform="rotate(45)">
    <path d="M-123-76H76V47H-29" fill="none" stroke="#F4F8FF" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M123 76H-76V-47H29" fill="none" stroke="#2388FF" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="-27" y="-27" width="54" height="54" fill="#2388FF" stroke="#05070B" stroke-width="6" stroke-linejoin="miter"/>
    <rect x="-10" y="-10" width="20" height="20" fill="#05070B"/>
  </g>
