        fill="none" stroke="#2388FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="34" r="2.4" fill="#74839A"/>
  <circle cx="24" cy="28" r="3.5" fill="#2388FF"/>
  <circle cx="36" cy="16" r="3.1" fill="#36D399"/>
