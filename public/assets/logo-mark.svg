<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -160 320 320" width="320" height="320" fill="none">
  <!-- Isotipo digitAI Motor · RETURN WEAVE / Sacred Weave.
       Dos recorridos reciprocos (uno es el otro rotado 180 grados) que
       pliegan hacia el nucleo siguiendo 11-18-29-47-76-123, progresion que
       converge a phi. El nucleo con vacio central es el diagnostico. -->
  <g transform="rotate(45)">
    <path d="M-123-76H76V47H-29V-18H11" fill="none" stroke="#155EEF" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M123 76H-76V-47H29V18H-11" fill="none" stroke="#46C8FF" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="-22" y="-22" width="44" height="44" fill="#46C8FF" stroke="#02050A" stroke-width="6" stroke-linejoin="miter"/>
    <rect x="-8" y="-8" width="16" height="16" fill="#02050A"/>
  </g>
</svg>
